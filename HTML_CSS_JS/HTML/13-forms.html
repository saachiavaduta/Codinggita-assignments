<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forms Assignment</title>

<body>

<!-- 1 -->
<form action="/submit.php" method="post" autocomplete="on">
  <input type="text" name="username">
  <button type="submit">Submit</button>
</form>

<!-- 2 -->
<form action="/search.php" method="get">

<form action="/submit.php" method="post" novalidate>

</form>

<!-- 4 -->
<!-- application/x-www-form-urlencoded is the default enctype because it encodes form data as simple key-value pairs -->
<form action="/submit.php" method="post" enctype="application/x-www-form-urlencoded">
  <input type="text" name="username">
  <input type="email" name="email">
  <button type="submit">Submit</button>
</form>

<!-- 5 -->
<form action="/upload.php" method="post" enctype="multipart/form-data">
  <input type="file" name="uploadFile">
  <button type="submit">Upload</button>
</form>

<!-- 6 -->
<!-- text/plain encoding is rarely used in real projects and mainly for debugging -->
<form action="/submit.php" method="post" enctype="text/plain">
  <input type="text" name="firstName">
  <input type="text" name="lastName">
  <button type="submit">Submit</button>
</form>

<!-- 7 -->
<form name="userForm" action="/submit.php" method="post" target="_blank">

<!-- 34 -->
<form action="/submit.php" method="post">
  <input type="text" name="data">

<!-- 35 -->
<form action="/login.php" method="post">
  <label for="username">Username:</label>
  <input type="text" id="username" name="username" required>

  <input type="password" id="password" name="password" required minlength="8">

</form>

<!-- 36 -->
<form action="/register.php" method="post">
  <fieldset>
    <legend>Personal Information</legend>
    <input type="text" name="fullName" required>
    <input type="email" name="email" required>
  </fieldset>
  <fieldset>
    <legend>Preferences</legend>
    <input type="checkbox" id="newsletter" name="newsletter">
    <label for="newsletter">Subscribe to newsletter</label>
  </fieldset>
  <button type="submit">Register</button>
</form>

<!-- 37 -->
<form action="/contact.php" method="post">
  <input type="text" name="name" required placeholder="Your Name">
  <input type="email" name="email" required placeholder="Your Email">
  <textarea name="message" rows="5" cols="40" required placeholder="Your Message"></textarea>
  <button type="submit">Send Message</button>
</form>

<!-- 38 -->
<form action="/feedback.php" method="post">
  <input type="range" name="satisfaction" min="1" max="10" value="5">
  <input type="radio" id="yes" name="recommend" value="yes">
  <label for="yes">Yes</label>
  <input type="radio" id="no" name="recommend" value="no">
  <label for="no">No</label>
  <textarea name="comments" rows="4" cols="40" placeholder="Additional comments"></textarea>
  <button type="submit">Submit Feedback</button>
</form>

<!-- 39 -->
<form action="/upload.php" method="post" enctype="multipart/form-data">

  <label for="photo">Profile Photo:</label>
  <input type="file" id="photo" name="photo" accept="image/*">
  <button type="submit">Upload</button>
</form>

<!-- 40 -->
<form action="/search.php" method="get">
  <input type="search" name="query" autofocus placeholder="Search the site...">
  <button type="submit">Search</button>
</form>

<!-- 41 -->
<form action="/apply.php" method="post" enctype="multipart/form-data">
  <fieldset>
    <legend>Personal Details</legend>
    <input type="text" name="fullName" placeholder="Full Name" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="tel" name="phone" placeholder="Phone Number" required>
  </fieldset>
  <fieldset>
    <legend>Experience</legend>
    <textarea name="experience" rows="5" cols="40" placeholder="Describe your experience"></textarea>
  </fieldset>
  <input type="file" name="resume" accept=".pdf" required>
  <input type="radio" id="fulltime" name="employmentType" value="fulltime">
  <label for="fulltime">Full-Time</label>
  <input type="radio" id="parttime" name="employmentType" value="parttime">
  <label for="parttime">Part-Time</label>
  <input type="checkbox" id="terms" name="terms" required>
  <label for="terms">I agree to the terms and conditions</label>
  <button type="submit">Submit Application</button>
  <button type="submit" formnovalidate>Save Draft</button>
</form>

<!-- 42 -->
<form action="/default.php" method="post" target="_self">
  <input type="text" name="field1" required>
  <input type="email" name="field2" required>

  <button type="submit" formaction="/alternate.php">Override Action</button>
  <button type="submit" formmethod="get">Override Method</button>
  <button type="submit" formnovalidate>Override Validation</button>
  <button type="submit" formtarget="_blank">Override Target</button>
</form>
