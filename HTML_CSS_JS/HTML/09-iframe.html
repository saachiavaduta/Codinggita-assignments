<!-- 30a, 30b, 30c, 30d & 30e -->
<!DOCTYPE html>
<html>
<head>
<title>Best Practice Iframe Usage</title>
</head>
<body>

<!-- No special permissions needed for a normal webpage -->
<iframe src="https://www.example.com" width="100%" height="300" title="Standard Webpage Frame" style="border:none;"></iframe>

<!-- Fullscreen and gyroscope needed for interactive video/demo content -->
<iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" width="560" height="315" allow="fullscreen; gyroscope" allowfullscreen title="Interactive Media Frame" style="border:none;"></iframe>

<!-- USB access needed for device-related content -->
<iframe src="https://device.example.com" width="600" height="400" allow="usb" title="Device Access Frame" style="border:none;"></iframe>

</body>
</html>
