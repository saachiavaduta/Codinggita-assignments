<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Images Assignment</title>
</head>
<body>

<!-- 1 -->
<img src="media/flower.jpg" alt="A blooming pink flower in a garden">

<!-- 2 -->
<img src="images/logo.png" alt="Company logo" width="200px">

<!-- 3 -->
<img src="assets/image/banner.jpg" alt="Website banner">

<!-- 4 -->
<img src="../photo.jpg" alt="Descriptive photo">

<!-- 5 -->
<img src="images/nature.jpg" alt="Beautiful nature view" width="300" height="200">

<!-- 6 -->
<img src="images/sample.jpg" alt="Sample image" title="Click to view full size">

<!-- 7 -->
<img src="images/photo.jpg" alt="Landscape photo" loading="lazy">

<!-- 8 -->
<img src="images/hero.jpg" alt="Hero banner image" loading="eager">

<!-- 9 -->
<img src="images/pic.jpg" alt="Sample picture" loading="auto">
<!-- Explanation: With loading="auto", the browser decides on its own whether to load the image immediately or lazily. -->

<!-- 10 -->
<img src="medium.jpg" 
     srcset="media/small.jpg 400w, media/medium.jpg 800w, media/large.jpg 1200w" 
     alt="Responsive scenic image">

<!-- 11 -->
<img src="images/product.jpg" 
     srcset="images/product-400.jpg 400w, images/product-800.jpg 800w" 
     alt="Product photo" 
     width="400" 
     height="300" 
     loading="lazy" 
     title="Click to view full size">

<!-- 12 -->
<img src="assets/logo.png" alt="Company logo" width="250px" loading="eager">
<img src="images/products/shoe.jpg" alt="Running shoe product photo" width="250px" loading="lazy">


</body>
</html>
