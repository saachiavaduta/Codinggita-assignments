<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Over</title>
    <style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(to bottom, #0b1d33 0%, #1d3b5c 45%, #2e6b2e 70%, #123d12 100%);
}

.logo {
    text-align: center;
    font-size: 40px;
    font-weight: bold;
    letter-spacing: 2px;
    padding-top: 30px;
}

.logo span {
    color: #ffc72c;
}

.teams {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 30px;
    margin-top: 60px;
    padding: 0 20px;
}

.team {
    width: 427px;
    max-width: 100%;
    height: 340px;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
}

.team.ind {
    background: #1f5fae;
}

.team.pak {
    background: #4caf32;
}

.team h2 {
    font-size: 72px;
    margin: 0 0 20px;
}

.balls {
    display: flex;
    gap: 10px;
}

.ball {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: white;
    color: black;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
}

.score {
    font-size: 40px;
    font-weight: bold;
    margin-top: 24px;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-top: 50px;
}

.controls button {
    width: 90px;
    height: 90px;
    border: none;
    border-radius: 16px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
}

.controls .bat {
    background: #f5b82e;
}

.controls .reset {
    background: #e53935;
}

@media (max-width: 700px) {
    .logo {
        font-size: 28px;
    }

    .team {
        height: 260px;
    }

    .team h2 {
        font-size: 48px;
    }

    .ball {
        width: 30px;
        height: 30px;
        font-size: 14px;
    }

    .balls {
        gap: 6px;
    }

    .score {
        font-size: 30px;
    }
}
    </style>
</head>
<body>

    <div class="logo">SUPER<span>OVER</span></div>

    <div class="teams">
        <div class="team ind">
            <h2>IND</h2>
            <div class="balls">
                <div class="ball">4</div>
                <div class="ball">3</div>
                <div class="ball">2</div>
                <div class="ball">6</div>
                <div class="ball">6</div>
                <div class="ball">6</div>
            </div>
            <div class="score">27/0</div>
        </div>

        <div class="team pak">
            <h2>PAK</h2>
            <div class="balls">
                <div class="ball">2</div>
                <div class="ball">4</div>
                <div class="ball">0</div>
                <div class="ball">3</div>
                <div class="ball">1</div>
                <div class="ball">4</div>
            </div>
            <div class="score">14/0</div>
        </div>
    </div>

    <div class="controls">
        <button class="bat">Bat</button>
        <button class="reset">Reset</button>
    </div>

</body>
</html>
