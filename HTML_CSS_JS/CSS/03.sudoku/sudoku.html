td:has(input) { background: #fff; }
td:nth-child(3n) { border-right: 2px solid #c2185b; }
tr:nth-child(3n) td { border-bottom: 2px solid #c2185b; }

input {

    font-size: min(20px, 5vw);

    color: #b5256f;
