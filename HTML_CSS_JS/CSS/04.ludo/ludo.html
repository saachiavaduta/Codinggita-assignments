<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo</title>
    <style>
        body {
            background: #fff0f6;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: #d63384;
        }

        .board {
            width: min(480px, 92vw);
            aspect-ratio: 1;
            margin: 20px auto;
            display: grid;
            grid-template: repeat(15, 1fr) / repeat(15, 1fr);
            background-color: white;
            background-image:
                linear-gradient(#f3c4dc 1px, transparent 1px),
                linear-gradient(90deg, #f3c4dc 1px, transparent 1px);
            background-size: calc(100% / 15) calc(100% / 15);
            border: 6px solid #ff8fc2;
            border-radius: 24px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .yard {
            display: grid;
            grid-template: 1fr 1fr / 1fr 1fr;
            place-items: center;
            padding: 16.7%;
        }

        .yard span {
            width: 50%;
            aspect-ratio: 1;
            border: 3px solid rgb(231, 228, 229);
            border-radius: 50%;
        }

        .yard.pink {
            grid-area: 1 / 1 / 7 / 7;
            background: linear-gradient(white, white) content-box, #ff4fa3;
        }

        .yard.violet {
            grid-area: 1 / 10 / 7 / 16;
            background: linear-gradient(white, white) content-box, #9b59b6;
        }

        .yard.sky {
            grid-area: 10 / 1 / 16 / 7;
            background: linear-gradient(white, white) content-box, #3ab0ff;
        }

        .yard.gold {
            grid-area: 10 / 10 / 16 / 16;
            background: linear-gradient(white, white) content-box, #ffc107;
        }

        .lane.pink {
            grid-area: 8 / 2 / 9 / 7;
            background: #ff4fa3;
        }

        .lane.violet {
            grid-area: 2 / 8 / 7 / 9;
            background: #9b59b6;
        }

        .lane.gold {
            grid-area: 8 / 10 / 9 / 15;
            background: #ffc107;
        }

        .lane.sky {
            grid-area: 10 / 8 / 15 / 9;
            background: #3ab0ff;
        }

        .center {
            grid-area: 7 / 7 / 10 / 10;
            background: conic-gradient(from -45deg, #9b59b6 0 90deg, #ffc107 90deg 180deg, #3ab0ff 180deg 270deg, #ff4fa3 270deg);
        }

        .star {
            color: #d63384;
        }

        .star:nth-child(10) { grid-area: 7 / 2; }
        .star:nth-child(11) { grid-area: 9 / 3; }
        .star:nth-child(12) { grid-area: 2 / 9; }
        .star:nth-child(13) { grid-area: 3 / 7; }
        .star:nth-child(14) { grid-area: 7 / 13; }
        .star:nth-child(15) { grid-area: 9 / 14; }
        .star:nth-child(16) { grid-area: 14 / 7; }
        .star:nth-child(17) { grid-area: 13 / 9; }
    </style>
</head>
<body>

    <h1>LUDO</h1>

    <div class="board">

        <div class="yard pink">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="yard violet">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="yard sky">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="yard gold">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="lane pink"></div>
        <div class="lane violet"></div>
        <div class="lane gold"></div>
        <div class="lane sky"></div>

        <div class="center"></div>

        <div class="star">★</div>
        <div class="star">★</div>
        <div class="star">★</div>
        <div class="star">★</div>
        <div class="star">★</div>
        <div class="star">★</div>
        <div class="star">★</div>
        <div class="star">★</div>

    </div>

</body>
</html>
